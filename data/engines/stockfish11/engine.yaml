# SPDX-License-Identifier: GPL-3.0-or-later
# Engine descriptor (architecture doc §8.2). Staged to engines/stockfish11/engine.yaml.
# Eco candidate (D8): classical evaluation, ~0.7 MB, nothing to load. Bundled only if the M2
# benchmark shows it saves CPU-seconds/RAM at the needed strengths.
id: stockfish11
name: "Stockfish 11 (Eco)"
protocol: uci
binary: { arm: stockfish11, windows-x64: stockfish11.exe }
files: []
license: GPL-3.0-or-later
roles: [play, analysis, hint, validate]
resources:                         # filled in from device measurements (M2 benchmark)
  disk_mb: 1
  rss_mb: null
  startup_ms: null
  energy_class: low                # the Eco profile picks the lightest engine for play/hint/validate
defaults: { Threads: 1, Hash: 16 }
strength:                          # UCI_Elo spans 1350-2850 in Stockfish 11
  beginner: { options: { "Skill Level": 0 },  limits: { movetime: 80 } }
  casual:   { options: { "Skill Level": 5 },  limits: { movetime: 200 } }
  club:     { options: { UCI_LimitStrength: true, UCI_Elo: 1600 } }
  strong:   { options: { UCI_LimitStrength: true, UCI_Elo: 2000 } }
  maximum:  { options: {} }
