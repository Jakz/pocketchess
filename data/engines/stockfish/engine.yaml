# SPDX-License-Identifier: GPL-3.0-or-later
# Engine descriptor (architecture doc §8.2). Staged to engines/stockfish/engine.yaml.
id: stockfish
name: "Stockfish 19"
protocol: uci                      # only 'uci' at first; 'builtin' reserved for InProcessEngine
binary: { arm: stockfish, windows-x64: stockfish.exe }
files: [nn-1a298aa575a0.nnue]      # the net ships beside the binary (R2); must match the pin (CMake checks)
license: GPL-3.0-or-later
roles: [play, analysis, hint, validate]
resources:                         # PB634K3 FW 6.10 (ADR 0010); shown in Settings
  disk_mb: 100                     # binary + net
  rss_mb: 140                      # after readyok, excluding Hash (peak 221 MiB while searching)
  startup_ms: 2500
  energy_class: high               # low | medium | high (relative CPU-seconds per job)
defaults: { Threads: 1, Hash: 16 }
strength:                          # label -> options + limits; validated against the UCI options (P10)
  beginner: { options: { "Skill Level": 0 },  limits: { movetime: 80 } }
  casual:   { options: { "Skill Level": 5 },  limits: { movetime: 200 } }
  club:     { options: { UCI_LimitStrength: true, UCI_Elo: 1600 } }
  strong:   { options: { UCI_LimitStrength: true, UCI_Elo: 2000 } }
  maximum:  { options: {} }
